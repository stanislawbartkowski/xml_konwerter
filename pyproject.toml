  [build-system]                                                                                                                                                                                                                                           
  requires = ["setuptools>=61"]
  build-backend = "setuptools.build_meta"                                                                                                                                                                                                                    
                                          
  [tool.setuptools.packages.find]                                                                                                                                                                                                                            
  where = ["."]                                                                                                                                                                                                                                              
   
  [project]                                                                                                                                                                                                                                                  
  name = "xml_konwerter"                                                                                                                                                                                                                                   
  version = "1.2.0"                           
  description = "Lightweight XML template processor with variable substitution"
  readme = "README.md"
  license = { file = "LICENSE" }                                                                                                                                                                                                                             
  requires-python = ">=3.10"
dependencies = ["lxml>=4.9"]                
  authors = [                                                                                                                                                                                                                                                
    { name = "Stanisław Bartkowski", email = "stanislawbartkowski@gmail.com" }                                                                                                                                                                             
  ]                                                                                                                                                                                                                                                          
  keywords = ["xml", "template", "invoice", "ksef"]
  classifiers = [                                                                                                                                                                                                                                            
    "Programming Language :: Python :: 3",                                                                                                                                                                                                                   
    "License :: OSI Approved :: MIT License", 
    "Operating System :: OS Independent",                                                                                                                                                                                                                    
  ]                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                             
  [project.urls]
  Homepage = "https://github.com/stanislawbartkowski/xml_konwerter"

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
exclude = ["build/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
