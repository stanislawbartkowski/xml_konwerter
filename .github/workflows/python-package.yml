name: Python package

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'xml_konwerter/**'
      - 'tests/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'xml_konwerter/**'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Test with pytest
        run: pytest
